steps:
  - id: resolve-hash-locked-gpu-dependencies
    name: >-
      ghcr.io/astral-sh/uv@sha256:f6bb96a2e3c5abe90eb9835a7f543067434d1d2d99d670315a9e826ba5f6fed9
    entrypoint: /bin/sh
    args:
      - -ceu
      - |
        python --version
        uv --version
        uv pip compile requirements-gpu.in \
          --python-version 3.11 \
          --python-platform x86_64-manylinux_2_28 \
          --torch-backend cu121 \
          --generate-hashes \
          --output-file requirements-gpu.lock
        test -s requirements-gpu.lock

artifacts:
  objects:
    location: >-
      gs://project-5909a738-2fdc-451e-ad6-watermark-data/cloud-build/gpu-locks/$BUILD_ID/
    paths:
      - requirements-gpu.lock

options:
  machineType: E2_STANDARD_2
  diskSizeGb: 100
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
