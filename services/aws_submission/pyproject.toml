[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "watermark-aws-submission"
version = "0.1.0"
description = "Authenticated, idempotent AWS Batch submission boundary"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3>=1.40,<2.0",
  "pydantic>=2.11,<3.0",
]

[dependency-groups]
dev = [
  "mypy>=1.15,<2.0",
  "pytest>=8.3,<10.0",
  "ruff>=0.11,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aws_submission"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["aws_submission"]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true
