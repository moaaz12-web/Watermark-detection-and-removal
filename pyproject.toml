[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "watermark-worker"
version = "0.1.0"
description = "Fail-closed, retry-safe GPU watermark worker foundation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "google-cloud-storage>=3.0,<4.0",
  "pillow>=10.0,<13.0",
  "pydantic>=2.11,<3.0",
  "pyyaml>=6.0,<7.0",
]

[project.scripts]
watermark-worker = "watermark_worker.cli:entrypoint"

[dependency-groups]
dev = [
  "mypy>=1.15,<2.0",
  "pytest>=8.3,<10.0",
  "pytest-cov>=6.0,<8.0",
  "ruff>=0.11,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/watermark_worker"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["watermark_worker"]

